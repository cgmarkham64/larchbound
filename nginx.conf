server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to the backend container.
    # Path is preserved: /api/trips → http://larchbound-api:8000/api/trips
    location /api/ {
        proxy_pass         http://larchbound-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend health check
    location /health {
        proxy_pass http://larchbound-api:8000;
    }

    # SPA fallback — unknown paths render index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}