networks:
  larchbound-net:
    driver: bridge

volumes:
  mongo-data:
  keycloak-data:

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8
    networks:
      - larchbound-net
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak (dev mode — embedded H2, no TLS) ──────────────────────────────
  # Realm + client setup: after first boot, visit http://localhost:8080 and
  # create realm "LarchBound", client "larchbound-app" (public, PKCE enabled),
  # and set redirect URIs to http://localhost:3000/*.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_SPI_THEME_STATIC_MAX_AGE: -1
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-themes:/opt/keycloak/themes
    ports:
      - "8080:8080"
    networks:
      - larchbound-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── API ────────────────────────────────────────────────────────────────────
  larchbound-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: ./server/.env         # loads PORT, JWT_SECRET, ANTHROPIC_API_KEY from local file
    environment:
      MONGODB_URI: mongodb://mongodb:27017/larchbound
      CORS_ORIGIN: http://localhost:3000
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/LarchBound/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8080/realms/LarchBound
    ports:
      - "8000:8000"                 # exposed for direct API access / debugging
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - larchbound-net
    restart: unless-stopped

  # ── Frontend (nginx) ───────────────────────────────────────────────────────
  larchbound-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - larchbound-api
    networks:
      - larchbound-net
    restart: unless-stopped